server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths go to index.html so client-side routes like /candidates/42 work.
  location / {
    try_files $uri /index.html;
  }

  # When a backend exists, proxy it here and build the image with VITE_API_URL=/api/v1.
  # location /api/ {
  #   proxy_pass http://api:8080/api/;
  # }
}
